name: Analyse sur modification Leboncoin

permissions:
  contents: write

on:
  push:
    paths:
      - "espace-client/biens/**_data.json"

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Génération analyse conditionnelle
        run: node espace-client/scripts/generate_analysis.js

      - name: Préparer email (si queue présente)
        id: mailvars
        run: |
          if [ -f "espace-client/strategic_email_queue.json" ]; then
            # on prend le dernier item ajouté
            SUBJECT=$(node -e "const a=require('./espace-client/strategic_email_queue.json'); const x=a[a.length-1]; console.log(x.subject)")
            BODY=$(node -e "const a=require('./espace-client/strategic_email_queue.json'); const x=a[a.length-1]; console.log(x.body.replace(/\r?\n/g,'\\n'))")
            echo "subject=$SUBJECT" >> $GITHUB_OUTPUT
            echo "body=$BODY" >> $GITHUB_OUTPUT
          else
            echo "subject=" >> $GITHUB_OUTPUT
            echo "body=" >> $GITHUB_OUTPUT
          fi

      - name: Envoyer email si changement de stratégie requis
        if: ${{ steps.mailvars.outputs.subject != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.mailvars.outputs.subject }}
          body: ${{ steps.mailvars.outputs.body }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
        env:
          EMAIL_QUEUE_PATH: espace-client/strategic_email_queue.json

      - name: Nettoyer la file email stratégique
        if: ${{ steps.mailvars.outputs.subject != '' }}
        run: |
          rm -f espace-client/strategic_email_queue.json

      - name: Commit si modification
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "analyse-bot"
            git config user.email "bot@github.com"
            git add espace-client/biens
            git commit -m "Analyse mise à jour (Leboncoin)"
            git push
          else
            echo "Aucune modification détectée"
          fi
