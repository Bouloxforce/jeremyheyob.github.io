name: Analyse automatique biens

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes
  push:
    paths:
      - "espace-client/biens/**_data.json"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Installer dépendances
        run: npm ci || npm install

      - name: Génération analyse & historique
        run: node espace-client/scripts/generate_analysis.js

      - name: Commit automatique si modifications
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "bot-analyse"
            git config user.email "bot@github-actions"
            git add espace-client/biens
            git commit -m "🤖 Mise à jour automatique historique & analyse"
            git push
          else
            echo "Aucune modification détectée"
          fi
