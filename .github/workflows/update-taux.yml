name: Mise à jour taux immobilier

on:
  schedule:
    - cron: "0 6 10 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mise à jour taux BDF
        run: node scripts/update_taux_bdf.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if git status --porcelain | grep .; then
            git add .
            git commit -m "Mise à jour automatique taux immobilier"
            git push
          else
            echo "Aucun changement à commit"
          fi
