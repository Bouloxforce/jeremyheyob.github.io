name: Mise à jour taux immobilier

on:
  schedule:
    - cron: "0 6 11 * *"   # Tous les premiers lundi de chaque mois
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Mise à jour taux immobilier
        run: node espace-client/scripts/update_taux_cafpi.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if git status --porcelain | grep .; then
            git add .
            git commit -m "Mise à jour automatique taux immobilier"
            git push
          else
            echo "Aucun changement à commit"
          fi
