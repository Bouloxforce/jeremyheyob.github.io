name: Analyse hebdomadaire biens

on:
  schedule:
    # Tous les lundis à 14:00 (après mise à jour manuelle Leboncoin)
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # 🆕 SNAPSHOT HEBDOMADAIRE
      # =========================
      - name: Snapshot hebdomadaire des statistiques
        run: |
          node espace-client/scripts/update-weekly-stats.js

      # =========================
      # ANALYSE STRATÉGIQUE
      # =========================
      - name: Générer analyses
        run: |
          node espace-client/scripts/generate_analysis.js

      # =========================
      # COMMIT DES MODIFICATIONS
      # =========================
      - name: Commit des analyses
        run: |
          git config user.name "Analyse automatique"
          git config user.email "bot@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Analyse hebdomadaire automatique"
          git push

      # =========================
      # NOTIFICATION SI RDV
      # =========================
      - name: Notification interne si RDV recommandé
        if: env.RDV_RECOMMANDE == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ssl0.ovh.net
          server_port: 465
          secure: true
          username: contact@jeremyheyob.fr
          password: ${{ secrets.MAIL_PASS }}
          subject: "📞 RDV à prévoir – Analyse automatique"
          to: contact@jeremyheyob.fr
          from: "Analyse automatique <contact@jeremyheyob.fr>"
          body: |
            📞 Un rendez-vous est recommandé suite à l’analyse automatique.

            Bien(s) concerné(s) :
            •  ${{ env.RDV_BIENS }}

            Merci de contacter rapidement le(s) client(s) afin d’ajuster la stratégie.
