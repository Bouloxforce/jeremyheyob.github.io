name: Génération automatique des biens

on:
  workflow_dispatch:
  push:
    paths:
      - "espace-visite/biens/**/data.json"
      - "espace-visite/biens/**/documents/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Générer JSON (biens + documents)
        run: node espace-visite/scripts/generate-biens.js

      - name: Commit auto
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add espace-visite/biens.json espace-visite/biens/**/documents.json
          git commit -m "auto: update biens & documents" || echo "No changes"
          git push
