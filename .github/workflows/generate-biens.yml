name: Synchronisation des biens et anonymisation des nouveaux PDF
concurrency:
  group: property-automation-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    paths:
      - "espace-client/biens/*.json"
      - "espace-visite/biens/**/documents/*.pdf"
      - ".github/workflows/generate-biens.yml"
      - "espace-visite/scripts/*.py"
      - "espace-visite/tests/*.py"
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  automate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Python et OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
          python -m pip install --upgrade pip
          pip install PyMuPDF Pillow pytesseract opencv-python-headless numpy
      - name: Vérifier la syntaxe
        run: |
          python -m py_compile espace-visite/scripts/anonymize_pdf.py
          python -m py_compile espace-visite/scripts/sync_client_to_visite.py
      - name: Tests automatisés
        run: python -m unittest discover -s espace-visite/tests -v
      - name: Synchroniser les JSON client modifiés
        run: python espace-visite/scripts/sync_client_to_visite.py
      - name: Anonymiser uniquement les PDF nouvellement ajoutés
        id: anonymize
        run: python espace-visite/scripts/anonymize_pdf.py
      - name: Notifier sur GitHub si l'anonymisation échoue
        if: failure() && steps.anonymize.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = 'Échec de l’anonymisation d’un PDF — publication bloquée';
            const body = [
              '⚠️ **Un PDF nouvellement ajouté n’a pas passé les contrôles d’anonymisation.**',
              '',
              'Le workflow s’est arrêté avant l’étape d’enregistrement des résultats générés.',
              'Le fichier original n’a pas été remplacé par un fichier anonymisé.',
              '',
              `- Branche : ${branch}`,
              `- Commit : ${context.sha}`,
              `- Déclencheur : ${context.actor}`,
              `- Exécution et détails de l’erreur : ${runUrl}`,
              '',
              'Ne republiez pas ce document avant correction et validation.'
            ].join('\n');
            const prs = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`
            });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prs.data[0].number, body
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Enregistrer les résultats générés
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_EVENT_BEFORE}" || "${GITHUB_EVENT_BEFORE}" =~ ^0+$ ]]; then
            echo "Aucun commit parent exploitable."
            exit 0
          fi
          mapfile -t NEW_PDFS < <(git diff --diff-filter=A --name-only "${GITHUB_EVENT_BEFORE}" "${GITHUB_SHA}" -- 'espace-visite/biens/*/documents/*.pdf')
          # Stage only actual workspace changes under public property folders.
          git add -A -- espace-visite/biens
          if (( ${#NEW_PDFS[@]} > 0 )); then git add -- "${NEW_PDFS[@]}"; fi
          if git diff --cached --quiet; then echo "Aucun changement généré."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "auto: sync public listings and anonymize new PDFs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
