name: Génération automatique des biens

# Serialize writes to the same branch: parallel runs could race during auto-commit/push.
concurrency:
  group: generate-biens-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - "espace-visite/biens/*/documents/**/*.pdf"
      - "espace-visite/scripts/anonymize_pdf.py"
      - "espace-visite/tests/**"
      - ".github/workflows/generate-biens.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python et OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
          python -m pip install --upgrade pip
          pip install PyMuPDF Pillow pytesseract opencv-python-headless numpy

      - name: Vérifier la syntaxe du moteur
        run: python -m py_compile espace-visite/scripts/anonymize_pdf.py

      - name: Tester le moteur PDF
        run: python -m unittest discover -s espace-visite/tests -v

      - name: Anonymiser les PDF et vérifier chaque page
        run: python espace-visite/scripts/anonymize_pdf.py

      - name: Commit auto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- 'espace-visite/biens/*/documents/*.pdf'
          git diff --cached --quiet || git commit -m "auto: anonymize newly added PDFs"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
