<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no">

  <title id="page-title">Espace visite | Bien | Jérémy Heyob Immobilier</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.ico">
  <link id="preload-image" rel="preload" as="image">

  <style>
    :root{
      --bg:#FFFBF5;
      --accent:#C6AA77;
      --accent-soft:rgba(198,169,119,0.16);
      --text-main:#191919;
      --text-soft:#7A7A7A;
      --border-soft:#e5e7eb;
      --card-bg:#fff;
      --shadow-soft:0 20px 50px rgba(25,25,25,0.10);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text-main)}
    .page{max-width:1100px;margin:0 auto;padding:24px 16px 50px}
    header{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:16px auto 24px;padding:8px 28px;background:#fff;border-radius:22px;box-shadow:var(--shadow-soft)}
    .logo{max-width:140px}
    .header-center{text-align:center;flex:1}
    .tagline-main{font-size:13px;letter-spacing:.18em;color:var(--text-soft)}
    .tagline-sub{margin-top:12px;font-size:12px;text-transform:uppercase}
    .tagline-sub strong{font-weight:900}
    .btn-retour{display:inline-block;margin:10px 0 18px;padding:6px 12px;font-size:13px;color:#7a5a29;text-decoration:none;border-radius:10px;border:1px solid rgba(198,169,119,.35);background:rgba(198,169,119,.10)}
    .layout{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}
    .card{background:#fff;border-radius:22px;padding:20px;border:1px solid var(--border-soft);box-shadow:var(--shadow-soft)}
    .pill{background:var(--accent-soft);color:var(--accent);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600}
    h1{font-size:26px;margin:10px 0 4px}
    .subtitle{color:var(--text-soft)}
    .chips{margin-top:12px}
    .chip{display:inline-block;margin:0 6px 6px 0;padding:6px 12px;border-radius:999px;background:rgba(198,169,119,.10);font-size:12px}
    .carousel{margin:20px 0;overflow:hidden;border-radius:16px;position:relative}
    .carousel-track{display:flex;transition:transform .35s ease}
    .carousel img{width:100%;flex:0 0 100%;cursor:pointer}
    .carousel-btn{position:absolute;top:50%;transform:translateY(-50%);background:#fff;border:none;font-size:22px;border-radius:999px;padding:6px 12px;cursor:pointer}
    .carousel-btn.prev{left:10px}
    .carousel-btn.next{right:10px}
    .grid-two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px;font-size:14px}
    .grid-two span{font-size:12px;color:var(--text-soft)}
    ul{padding-left:18px}
    .contact-block{display:flex;gap:18px;align-items:center;background:#fff;border-radius:20px;padding:16px;border:1px solid var(--border-soft);box-shadow:0 18px 40px rgba(25,25,25,.08);max-width:960px;margin:30px auto 0}
    .contact-photo{width:90px;height:90px;border-radius:50%;overflow:hidden;border:2px solid #e5e7eb}
    .contact-photo img{width:100%;height:100%;object-fit:cover}
    .legal-footer{text-align:center;font-size:11.5px;color:var(--text-soft);margin-top:40px}
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999}
    .lightbox.active{display:flex}
    .lightbox img{max-width:90%;max-height:90vh;border-radius:12px}
    @media(max-width:880px){
      .layout{grid-template-columns:1fr}
      header{flex-direction:column}
      .contact-block{flex-direction:column;text-align:center}
    }
  </style>
</head>

<body>
<div class="page">

<header>
  <img src="/images/logo.webp" class="logo" alt="">
  <div class="header-center">
    <div class="tagline-main">VOS PROJETS IMMOBILIERS N'ONT JAMAIS ÉTÉ AUSSI SIMPLES !</div>
    <div class="tagline-sub"><strong>JÉRÉMY HEYOB</strong></div>
  </div>
</header>

<a href="/espace-visite/accueil.html" class="btn-retour">← Retour</a>

<main class="layout">
  <section class="card">
    <span class="pill">Informations du bien</span>
    <h1 id="bien-nom"></h1>
    <p class="subtitle" id="bien-subtitle"></p>
    <div class="chips" id="bien-chips"></div>

    <div class="carousel">
      <div class="carousel-track" id="carousel-track"></div>
      <button class="carousel-btn prev">‹</button>
      <button class="carousel-btn next">›</button>
    </div>

    <div class="grid-two" id="bien-infos"></div>

    <h2>Documents</h2>
    <ul id="documents-list"></ul>
  </section>

  <section class="card">
    <h2>Contre-visite</h2>
    <p class="subtitle">Contactez-moi pour organiser une nouvelle visite.</p>
  </section>
</main>

<section class="contact-block">
  <div class="contact-photo">
    <img src="/images/photo.webp" alt="">
  </div>
  <div>
    <h3>Une question sur ce bien ?</h3>
    <p>Email · SMS · Appel</p>
  </div>
</section>

<footer class="legal-footer">
  © Jérémy Heyob Immobilier – Tous droits réservés
</footer>

</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg"></div>

<script>
(async function(){
  const slug=new URLSearchParams(location.search).get("bien");
  if(!slug)return;

  const paths=[
    `/espace-visite/${slug}/data.json`,
    `/espace-visite/sous-compromis/${slug}/data.json`
  ];

  let data=null,basePath="";
  for(const p of paths){
    const r=await fetch(p);
    if(r.ok){data=await r.json();basePath=p.replace("/data.json","");break;}
  }
  if(!data)return;

  const nom=data.nom||slug;
  document.getElementById("page-title").textContent=`Espace visite | ${nom}`;
  document.getElementById("bien-nom").textContent=nom;
  document.getElementById("bien-subtitle").textContent=data.description||"";

  (data.chips||[]).forEach(c=>{
    const s=document.createElement("span");
    s.className="chip";s.textContent=c;
    document.getElementById("bien-chips").appendChild(s);
  });

  const track=document.getElementById("carousel-track");
  (data.photos||[]).forEach((p,i)=>{
    const img=document.createElement("img");
    img.src=`${basePath}/photos/${p}`;
    if(i===0)document.getElementById("preload-image").href=img.src;
    img.onclick=()=>{lightboxImg.src=img.src;lightbox.classList.add("active");};
    track.appendChild(img);
  });

  Object.entries(data.infos||{}).forEach(([k,v])=>{
    const d=document.createElement("div");
    d.innerHTML=`<span>${k}</span>${v}`;
    document.getElementById("bien-infos").appendChild(d);
  });

  const docs=await fetch(`${basePath}/documents.json`).then(r=>r.ok?r.json():[]);
  docs.forEach(d=>{
    const li=document.createElement("li");
    li.innerHTML=`<a href="${basePath}/documents/${d.file}" target="_blank">${d.title}</a>`;
    document.getElementById("documents-list").appendChild(li);
  });

  document.querySelector(".next").onclick=()=>track.style.transform=`translateX(-100%)`;
  document.querySelector(".prev").onclick=()=>track.style.transform=`translateX(0)`;
  lightbox.onclick=()=>lightbox.classList.remove("active");
})();
</script>
</body>
</html>
